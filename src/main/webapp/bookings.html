<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookings - Hotel Management System</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        /* Add some basic styling for the bookings table */
        .bookings-container {
            padding: 20px;
            max-width: 1200px;
            margin: 20px auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .bookings-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .bookings-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .bookings-table th, .bookings-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        .bookings-table th {
            background-color: #f2f2f2;
            color: #555;
            font-weight: bold;
        }
        /* Remove default even/odd row coloring to let status colors dominate */
        /* .bookings-table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        } */
        .bookings-table tbody tr:hover {
            background-color: #e9e9e9;
        }
        .no-bookings {
            text-align: center;
            color: #777;
            padding: 20px;
        }
        .filter-controls, .search-controls {
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .filter-controls label, .search-controls label {
            margin-right: 5px;
            font-weight: bold;
        }
        .filter-controls select, .search-controls input[type="text"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
            min-width: 180px;
        }
        .search-controls button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        .search-controls button:hover {
            background-color: #0056b3;
        }
        /* Style for the status dropdown */
        .status-dropdown {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
            background-color: #f8f8f8;
            cursor: pointer;
        }
        .status-dropdown:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        /* NEW STATUS COLORS */
        .status-row-checked_in {
            background-color: #e6ffe6; /* Light Green */
        }
        .status-row-checked_out {
            background-color: #e6f7ff; /* Light Blue */
        }
        .status-row-cancelled {
            background-color: #ffe6e6; /* Light Red */
        }
        .status-row-pending {
            background-color: #fff0e6; /* Light Orange */
        }
        .status-row-confirmed {
            background-color: #ffffff; /* White */
        }

        /* Style for the Bill button */
        .bill-button {
            padding: 6px 12px;
            background-color: #28a745; /* Green */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .bill-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">🏨 SRH GROUP OF HOTELS</div>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="index.html">Check Availability</a></li>
                <li><a href="bookings.html">Bookings</a></li>
                <li><a href="hotel.html">Hotels & Rooms</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="#">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="bookings-container">
        <h1>Bookings Overview</h1>

        <div class="search-controls">
            <label for="searchField">Search Booking:</label>
    		<input type="text" id="searchField" placeholder="Booking ID, Customer ID, Last Name" style="width: 400px;">
            <button id="searchButton">Search</button>
            <button id="clearSearchButton">Clear Search</button>
        </div>

        <div class="filter-controls">
            <label for="hotelFilter">Filter by Hotel:</label>
            <select id="hotelFilter">
                <option value="">All Hotels</option>
                </select>
        </div>

        <table class="bookings-table">
            <thead>
                <tr>
                    <th>Booking ID</th>
                    <th>Customer Name</th>
                    <th>Check-in Date</th>
                    <th>Check-out Date</th>
                    <th>Status</th>
                    <th>Room Numbers</th>
                    <th>Bill</th> </tr>
            </thead>
            <tbody id="bookingsTableBody">
                </tbody>
        </table>
        <p id="noBookingsMessage" class="no-bookings" style="display: none;">No bookings found.</p>
    </div>

    <footer>
        <p>&copy; 2025 HotelSys. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetchHotelsAndPopulateFilter();
            fetchBookings();
        });

        async function fetchHotelsAndPopulateFilter() {
            const hotelFilter = document.getElementById('hotelFilter');
            try {
                const response = await fetch('/HotelManagementSystem/api/hotels');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const hotels = await response.json();

                hotels.forEach(hotel => {
                    const option = document.createElement('option');
                    option.value = hotel.id;
                    option.textContent = hotel.name;
                    hotelFilter.appendChild(option);
                });

                hotelFilter.addEventListener('change', fetchBookings);

            } catch (error) {
                console.error('Error fetching hotels:', error);
            }
        }

        async function fetchBookings() {
            const bookingsTableBody = document.getElementById('bookingsTableBody');
            const noBookingsMessage = document.getElementById('noBookingsMessage');
            const searchField = document.getElementById('searchField');
            const hotelFilter = document.getElementById('hotelFilter');

            const searchTerm = searchField.value.trim();
            const selectedHotelId = hotelFilter.value;

            bookingsTableBody.innerHTML = '';
            noBookingsMessage.style.display = 'none';

            let baseUrl = '/HotelManagementSystem/api/bookings';
            let params = [];

            if (searchTerm) {
                if (!isNaN(searchTerm) && searchTerm !== '') {
                    try {
                        const idResponse = await fetch(`${baseUrl}?id=${searchTerm}`);
                        if (idResponse.ok) {
                            const booking = await idResponse.json();
                            if (booking && booking.id) {
                                displayBookings([booking]);
                                return;
                            }
                        }
                    } catch (e) {
                        console.warn("Booking ID search failed or returned no single booking:", e);
                    }
                    params.push(`customer_id=${searchTerm}`);
                } else {
                    params.push(`customer_last_name=${encodeURIComponent(searchTerm)}`);
                }
            } else {
                params.push(`status=current`);
            }

            if (selectedHotelId) {
                params.push(`hotel_id=${selectedHotelId}`);
            }

            const url = `${baseUrl}?${params.join('&')}`;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    if (response.status === 404 && searchTerm && !isNaN(searchTerm) && !selectedHotelId) {
                         noBookingsMessage.textContent = 'Booking not found.';
                         noBookingsMessage.style.display = 'block';
                         return;
                    }
                    throw new Error(`HTTP error! status: ${response.status}, message: ${response.statusText}`);
                }
                const bookings = await response.json();

                displayBookings(bookings);
            } catch (error) {
                console.error('Error fetching bookings:', error);
                bookingsTableBody.innerHTML = '<tr><td colspan="7" style="color: red; text-align: center;">Failed to load bookings. Please try again.</td></tr>'; // Changed colspan to 7
                noBookingsMessage.style.display = 'none';
            }
        }

        function displayBookings(bookings) {
            const bookingsTableBody = document.getElementById('bookingsTableBody');
            const noBookingsMessage = document.getElementById('noBookingsMessage');
            const statusOptions = ['pending', 'confirmed', 'cancelled', 'checked_in', 'checked_out'];

            bookingsTableBody.innerHTML = '';
            noBookingsMessage.style.display = 'none';

            if (bookings.length === 0) {
                noBookingsMessage.textContent = 'No bookings found matching your criteria.';
                noBookingsMessage.style.display = 'block';
            } else {
                bookings.forEach(booking => {
                    const row = bookingsTableBody.insertRow();
                    row.classList.add(`status-row-${booking.status.toLowerCase().replace(/\s/g, '_')}`); // Normalize status for class name

                    row.insertCell().textContent = booking.id;
                    row.insertCell().textContent = `${booking.customerFirstName} ${booking.customerLastName}`;
                    row.insertCell().textContent = booking.checkInDate;
                    row.insertCell().textContent = booking.checkOutDate;

                    const statusCell = row.insertCell();
                    const statusSelect = document.createElement('select');
                    statusSelect.className = 'status-dropdown';
                    statusSelect.dataset.bookingId = booking.id;

                    statusOptions.forEach(optionText => {
                        const option = document.createElement('option');
                        option.value = optionText;
                        let displayText = optionText.replace(/_/g, ' ').split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
                        option.textContent = displayText;
                        if (optionText === booking.status) {
                            option.selected = true;
                        }
                        statusSelect.appendChild(option);
                    });

                    statusSelect.addEventListener('change', async (event) => {
                        const newStatus = event.target.value;
                        const bookingId = event.target.dataset.bookingId;
                        await updateBookingStatus(bookingId, newStatus);
                        // Reapply class to the row immediately after successful update for feedback
                        const currentRow = event.target.closest('tr');
                        if (currentRow) {
                            // Remove all existing status classes
                            statusOptions.forEach(opt => {
                                currentRow.classList.remove(`status-row-${opt.toLowerCase().replace(/\s/g, '_')}`);
                            });
                            // Add the new status class
                            currentRow.classList.add(`status-row-${newStatus.toLowerCase().replace(/\s/g, '_')}`);
                        }
                    });

                    statusCell.appendChild(statusSelect);

                    row.insertCell().textContent = booking.roomNumbers ? booking.roomNumbers.join(', ') : 'N/A';

                    // Bill button
                    const billCell = row.insertCell();
                    const billButton = document.createElement('button');
                    billButton.textContent = 'Generate Bill';
                    billButton.className = 'bill-button';
                    billButton.dataset.bookingId = booking.id; 
                    billButton.addEventListener('click', async (event) => {
                        const bookingId = event.target.dataset.bookingId;
                        await generateBill(bookingId);
                    });
                    billCell.appendChild(billButton);
                });
            }
        }

        async function updateBookingStatus(bookingId, newStatus) {
            try {
                const response = await fetch('/HotelManagementSystem/api/bookings', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: parseInt(bookingId),
                        status: newStatus
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`HTTP error! status: ${response.status}, message: ${errorData.error}`);
                }

                const result = await response.json();
                alert(result.message);

            } catch (error) {
                console.error('Error updating booking status:', error);
                alert('Failed to update booking status: ' + error.message);
            }
        }

        //generate and display the bill
        async function generateBill(bookingId) {
            try {
                const response = await fetch(`/HotelManagementSystem/api/bill?bookingId=${bookingId}`);
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`HTTP error! status: ${response.status}, message: ${errorData.error}`);
                }

                const billData = await response.json();
                displayBillInNewWindow(billData); // Function to show bill details
            } catch (error) {
                console.error('Error generating bill:', error);
                alert('Failed to generate bill: ' + error.message);
            }
        }

        // display bill details
        function displayBillInNewWindow(billData) {
            let billContent = `
                <h2>Bill for Booking ID: ${billData.bookingDetails.bookingId}</h2>
                <h3>Customer Details:</h3>
                <p>Name: ${billData.customer.firstName} ${billData.customer.lastName}</p>
                <p>Email: ${billData.customer.email}</p>
                <p>Phone: ${billData.customer.phoneNumber}</p>
                <p>Address: ${billData.customer.address}</p>

                <h3>Booking Information:</h3>
                <p>Check-in Date: ${billData.bookingDetails.checkInDate}</p>
                <p>Check-out Date: ${billData.bookingDetails.checkOutDate}</p>
                <p>Number of Nights: ${billData.bookingDetails.numberOfNights}</p>
                <p>Room: ${billData.bookingDetails.roomNumber} (${billData.bookingDetails.roomType})</p>
                <p>Room Price per Night: €${billData.bookingDetails.roomPricePerNight.toFixed(2)}</p>
                <p>Total Room Charge: €${billData.bookingDetails.totalRoomCharge.toFixed(2)}</p>

                <h3>Services Used:</h3>
            `;

            if (billData.servicesUsed && billData.servicesUsed.length > 0) {
                billContent += `
                    <table style="width:100%; border-collapse: collapse; margin-top: 10px;">
                        <thead>
                            <tr>
                                <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Service</th>
                                <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Price/Unit</th>
                                <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Quantity</th>
                                <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                billData.servicesUsed.forEach(service => {
                    billContent += `
                        <tr>
                            <td style="border: 1px solid #ddd; padding: 8px;">${service.serviceName}</td>
                            <td style="border: 1px solid #ddd; padding: 8px;">€${service.servicePricePerUnit.toFixed(2)}</td>
                            <td style="border: 1px solid #ddd; padding: 8px;">${service.quantity}</td>
                            <td style="border: 1px solid #ddd; padding: 8px;">€${service.totalServiceCost.toFixed(2)}</td>
                        </tr>
                    `;
                });
                billContent += `</tbody></table>`;
            } else {
                billContent += `<p>No services used.</p>`;
            }

            billContent += `
                <h3 style="margin-top: 20px;">Grand Total: €${billData.grandTotal.toFixed(2)}</h3>
            `;

            const billWindow = window.open('', '_blank', 'width=600,height=700,scrollbars=yes');
            billWindow.document.write(`
                <html>
                <head>
                    <title>Bill for Booking ${billData.bookingDetails.bookingId}</title>
                    <style>
                        body { font-family: Arial, sans-serif; margin: 20px; }
                        h2, h3 { color: #333; }
                        p { margin-bottom: 5px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                        th { background-color: #f2f2f2; }
                    </style>
                </head>
                <body>
                    ${billContent}
                    <button onclick="window.print()" style="margin-top: 20px; padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">Print Bill</button>
                </body>
                </html>
            `);
            billWindow.document.close();
        }


        document.getElementById('searchButton').addEventListener('click', fetchBookings);
        document.getElementById('clearSearchButton').addEventListener('click', function() {
            document.getElementById('searchField').value = '';
            document.getElementById('hotelFilter').value = '';
            fetchBookings();
        });
        document.getElementById('searchField').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                fetchBookings();
            }
        });
    </script>
</body>
</html>
