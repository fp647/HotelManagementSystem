<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Add Room - SRH Group</title>
        <link rel="stylesheet" href="new-hotel.css" />
    </head>
    <body>
        <header class="navbar">
            <div class="logo">🏨 SRH GROUP OF HOTELS</div>
            <nav>
                <ul>
                    <li><a href="hotel.html">Back to Hotel List</a></li>
                </ul>
            </nav>
        </header>

        <section class="hero">
            <h1>Add a New Room</h1>
            <p>Select hotel and enter room details</p>
        </section>

        <section class="form-section">
            <form id="roomForm" class="hotel-form">
                <label for="hotel">Select Hotel</label>
                <select id="hotel" required></select>

                <label for="image">Room Image Filename (e.g., room1.jpg)</label>
                <input type="text" id="image" required />

                <label for="roomNumber">Room Number</label>
                <input type="text" id="roomNumber" required />

                <label for="floor">Floor</label>
                <input type="number" id="floor" required />

                <label for="category">Category</label>
                <input type="text" id="category" required />

                <label for="size">Room Size (sq.m)</label>
                <input type="text" id="size" required />

                <label for="basePrice">Base Price ($)</label>
                <input type="number" id="basePrice" required />

                <label for="maxOccupancy">Max Occupancy</label>
                <input type="number" id="maxOccupancy" required />

                <label>
                    <input type="checkbox" id="isAvailable" checked />
                    Available
                </label>

                <button type="submit">Add Room</button>
            </form>
        </section>

        <script src="new-room.js"></script>
    </body>
</html>
