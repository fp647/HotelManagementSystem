<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Booking Confirmation</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .confirmation-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 600px;
      margin: 20px;
    }
    .confirmation-container h1 {
      color: #2980b9;
      margin-bottom: 20px;
    }
    .confirmation-container p {
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .confirmation-container .booking-ref {
      font-weight: bold;
      color: #e74c3c;
      font-size: 1.3rem;
    }
    .back-home {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background-color: #2980b9;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    .back-home:hover {
      background-color: #3498db;
    }
  </style>
</head>
<body>
  <div class="confirmation-container">
    <h1>Booking Confirmed!</h1>
    <p>Thank you for your booking at our Hotel.</p>
    <p>Your booking reference number is: <span class="booking-ref" id="bookingReference"></span></p>
    <a href="index.html" class="back-home">Back to Home</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      const bookingId = urlParams.get('bookingId');
      if (bookingId) {
        document.getElementById('bookingReference').textContent = bookingId;
      } else {
        document.getElementById('bookingReference').textContent = 'N/A'; // Or handle missing ID appropriately
      }
    });
  </script>
</body>
</html>
