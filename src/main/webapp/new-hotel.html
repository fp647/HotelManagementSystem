<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Add New Hotel - SRH Group</title>
        <link rel="stylesheet" href="new-hotel.css" />
    </head>
    <body>
        <header class="navbar">
            <div class="logo">🏨 SRH GROUP OF HOTELS</div>
            <nav>
                <ul>
                    <li><a href="hotel.html">Back to Hotel List</a></li>
                </ul>
            </nav>
        </header>

        <section class="hero">
            <h1>Add a New Hotel</h1>
            <p>Enter hotel details below</p>
        </section>

        <section class="form-section">
            <form id="hotelForm" class="hotel-form">
                <label for="name">Hotel Name</label>
                <input type="text" id="name" required />

                <label for="address">Address</label>
                <input type="text" id="address" required />

                <label for="country">Country</label>
                <input type="text" id="country" required />

                <label for="city">City</label>
                <input type="text" id="city" required />

                <label for="phone">Phone Number</label>
                <input type="text" id="phone" required />

                <label for="email">E-Mail</label>
                <input type="email" id="email" required />

                <label for="image">Image Filename (e.g., hotel4.jpg)</label>
                <input type="text" id="image" required />

                <button type="submit">Add Hotel</button>
            </form>
        </section>

        <script src="new-hotel.js"></script>
    </body>
</html>
